version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finance_tracker_db
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance_tracker_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finance_tracker
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      TELEGRAM_BOT_USERNAME: financewithbekabot
      TELEGRAM_BOT_TOKEN: 8507240940:AAG-wvy5Buq1v3OgOlz8D_vH5NaFQr9zDAw
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

volumes:
  pgdata: